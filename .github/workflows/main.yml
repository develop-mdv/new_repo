name: Python CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Check Python syntax
        run: python -m py_compile prog1.py prog2.py prog3.py

      - name: Run prog1
        run: python prog1.py

      - name: Test prog2
        run: |
          output=$(printf 'hello\n' | python prog2.py)
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -Fx "Length: 5"

      - name: Run prog3
        run: python prog3.py

      - name: Run integration tests
        run: python -m unittest discover -s tests -v
      - name: Generate documentation
        run: python build_docs.py

      - name: Upload documentation
        uses: actions/upload-artifact@v7
        with:
          name: project-documentation-${{ github.sha }}
          path: docs/index.html
          if-no-files-found: error
          retention-days: 30
